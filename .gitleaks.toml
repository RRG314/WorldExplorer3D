title = "WorldExplorer Secret Scan Config"

[extend]
useDefault = true

[allowlist]
description = "Firebase web config key paths (public client key expected)"
paths = [
  '''config/firebase\.(production|staging)\.json''',
  '''js/firebase-project-config\.js''',
  '''public/js/firebase-project-config\.js''',
  '''public/__/firebase/init\.(js|json)'''
]
regexes = [
  # Exact device-local save namespace; it grants no authentication or access.
  '''^we3d\.ocean\.voyage\.v1$''',
  '''sk_(live|test)_\.\.\.''',
  '''whsec_\.\.\.''',
  '''price_\.\.\.'''
]
