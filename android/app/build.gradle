plugins { id 'com.android.application' }

android {
    namespace 'io.worldexplorer3d.app'
    compileSdk 36
    defaultConfig {
        applicationId 'io.worldexplorer3d.app'
        // Current Chrome requires Android 10+. Do not offer a new TWA to
        // systems whose browser can no longer receive current releases.
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName '5.6.1-test.4'
        resValue 'string', 'provider_authority', 'io.worldexplorer3d.app.fileprovider'
        buildConfigField 'String', 'PORTAL_ORIGIN', '"https://worldexplorer3d.io"'
        buildConfigField 'String', 'PORTAL_API_ORIGIN', '"https://us-central1-worldexplorer3d-d9b83.cloudfunctions.net"'
        manifestPlaceholders = [gameUrl: 'https://worldexplorer3d.io/app/?distribution=google-play', gameOrigin: 'https://worldexplorer3d.io']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.staging'
            versionNameSuffix '-dev'
            resValue 'string', 'provider_authority', 'io.worldexplorer3d.app.staging.fileprovider'
            buildConfigField 'String', 'PORTAL_ORIGIN', '"https://we3d-staging-20260712.web.app"'
            buildConfigField 'String', 'PORTAL_API_ORIGIN', '"https://us-central1-we3d-staging-20260712.cloudfunctions.net"'
            manifestPlaceholders = [gameUrl: 'https://we3d-staging-20260712.web.app/app/?distribution=google-play', gameOrigin: 'https://we3d-staging-20260712.web.app']
        }
        release {
            // Signing is deliberately local. CI never receives the upload key.
            minifyEnabled false
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    buildFeatures { buildConfig true }
    dependencyLocking { lockAllConfigurations() }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
}
