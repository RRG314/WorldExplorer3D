for(let i=0;i<24;i++){const z=i*10;roads.push({sourceId:'controlled-grid:'+i,a:{x:0,y:height(0,z),z},b:{x:0,y:height(0,z+10),z:z+10},widthMeters:9,driveable:true,supported:true,heightSamples:[0,1].map(t=>({t,y:height(0,z+t*10),leftY:height(-1.2/unit,z+t*10),rightY:height(1.2/unit,z+t*10)})),heightSampleSpanMeters:1.2});}

for(let z=-20;z<260;z+=2){const points=[[-4.5/unit,z],[4.5/unit,z],[4.5/unit,z+2],[-4.5/unit,z+2]];for(const i of[0,1,2,0,2,3])p.push(points[i][0],height(...points[i]),points[i][1]);}
