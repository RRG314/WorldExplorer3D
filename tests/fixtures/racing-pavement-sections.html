<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#b5cbd4;color:#172a2d;font:15px system-ui}canvas{display:block}p{margin:8px}</style><p>Shared racing physics · Controlled bank/apron · Up drives the BMW M3 race car.</p>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script><script type="module">
import {createPavementSectionsFixture} from './pavement-sections.js';
import {createRoadContactIndex} from '/app/js/terrain/road-contact-index.js';
import {collectRaceDistrict} from '/app/js/racing/world-course-source.js';
import {sampleFeatureSurfaceY} from '/app/js/structure-semantics.js?v=63';
import {buildRaceRoadGraph,createRaceCourse} from '/app/js/racing/course-rules.js';

import {applyRoadCreaseNormals} from '/app/js/terrain/road-crease-normals.js';

const f=await createPavementSectionsFixture({length:300}),scene=new THREE.Scene();scene.background=new THREE.Color('#b5cbd4');scene.add(new THREE.HemisphereLight(0xf4f7fb,0x646b50,.8));const sun=new THREE.DirectionalLight(0xfff5df,.9);sun.position.set(30,700,-30);scene.add(sun);
const owned=[];function mesh(p,i,mat,crease=false){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));if(i)g.setIndex(new THREE.BufferAttribute(i,1));if(crease)applyRoadCreaseNormals(g);else g.computeVertexNormals();owned.push(g,mat);const m=new THREE.Mesh(g,mat);scene.add(m);return m;}
mesh(f.terrain.meshes[0].positions,f.terrain.meshes[0].indices,new THREE.MeshStandardMaterial({color:0x6b7b58,roughness:1}));for(const b of f.batches)mesh(b.positions,b.indices,new THREE.MeshStandardMaterial({color:0x30383c,roughness:1}),true);
const contacts=createRoadContactIndex(f.batches.map(b=>({geometry:{attributes:{position:{array:b.positions}},getIndex:()=>({array:b.indices})},userData:{terrainMode:'at_grade'}}))),context={METERS_PER_WORLD_UNIT:1,worldPublication:{requestId:'controlled-published-physics',location:{lat:29.185,lon:-81.071}},buildings:[],roadContactIndex:contacts,sampleFeatureSurfaceY,transportDetail:{hasReadyCoverageAt:()=>true},buildTraversalNetworks:()=>({drive:{segments:f.road.pts.slice(1).map((p2,segIndex)=>({feature:f.road,p1:f.road.pts[segIndex],p2,segIndex,sourceTStart:0,sourceTEnd:1,fromId:segIndex,toId:segIndex+1,direction:'forward'}))}}),SurfaceQuery:{driveAt:(x,z,o)=>{const y=contacts.sampleAt(x,z,o.currentY,'at_grade');return {kind:Number.isFinite(y)?'road':'terrain',position:{y}};}}},facts=await collectRaceDistrict(context,{radiusWorld:500,yieldWork:async()=>{}}),graph=buildRaceRoadGraph(facts.roads),course=createRaceCourse(graph,graph.edges.map(e=>e.id),{discipline:'sprint',participants:1,locationId:'controlled',locationLabel:'Controlled apron',anchor:{lat:29.185,lon:-81.071}}),paint=buildRacePaint(course);
const paintMesh=mesh(paint.positions,null,createRoadMarkingMaterial({color:0xffffff,vertexColors:true,roughness:.9,filteredStroke:true},THREE));paintMesh.geometry.setAttribute('color',new THREE.BufferAttribute(paint.colors,3));paintMesh.geometry.setAttribute('markingStroke',new THREE.BufferAttribute(paint.strokeCoverage,4));paintMesh.renderOrder=4;const furniture=prepareRaceFurniture(THREE,{},course);scene.add(furniture.root);
const profile=createRaceVehicleProfile('bmw_m3_e92_race'),car=createRaceVehicleState({x:12,y:contacts.sampleAt(12,5),z:5,yaw:0},profile),host=new THREE.Group();scene.add(host);if(!await attachCuratedTrafficVehicle(THREE,host,{variantId:'bmw_m3_e92_race'}))throw Error('Shared M3 visual unavailable');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=THREE.sRGBEncoding;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(50,12/7,.1,1000),held=new Set();let simulatedMs=0;const initialZ=car.z;
function draw(){host.position.set(car.x,car.y,car.z);host.rotation.set(car.terrainPitch||0,car.angle,car.terrainRoll||0);syncCuratedVehicleGroundPivot(host);camera.position.set(car.x+8,car.y+5,car.z-12);camera.lookAt(car.x,car.y-.4,car.z+10);furniture.update(car);renderer.render(scene,camera);}
addEventListener('keydown',e=>held.add(e.code));addEventListener('keyup',e=>held.delete(e.code));window.advanceTime=ms=>{for(let remaining=ms;remaining>1e-6;){const dt=Math.min(1/60,remaining/1000);stepRaceVehicle(course,car,{throttle:held.has('ArrowUp')?1:0,steer:held.has('ArrowLeft')?1:held.has('ArrowRight')?-1:0,serviceBrake:held.has('ArrowDown')?1:0},dt,profile);simulatedMs+=dt*1000;remaining-=dt*1000;}draw();};window.render_game_to_text=()=>JSON.stringify({scope:'Controlled published pavement and shared physics, not native venue acceptance',simulatedMs,assetId:host.userData.curatedTrafficAssetId,racingWidthMeters:racePavementCrossSection(course.segments[0],0).racingWidthMeters,physicalWidthMeters:course.segments[0].widthMeters,firstGateHalfWidthMeters:course.gates[0].halfWidthMeters,x:car.x,y:car.y,z:car.z,distance:car.z-initialZ,speed:car.speed,roll:car.terrainRoll,gap:car.maximumWheelGap,penetration:car.maximumWheelPenetration,barrierContacts:car.barrierContacts,glError:renderer.getContext().getError()});addEventListener('pagehide',()=>{disposeCuratedTrafficVehicle(host);contacts.dispose();furniture.dispose();for(const o of owned)o.dispose();renderer.dispose();});draw();
</script>
