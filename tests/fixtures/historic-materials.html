<!doctype html><meta charset="utf-8"><title>Historic material validation</title><style>body{margin:0}canvas{display:block}</style>
<script src="/node_modules/three/build/three.min.js"></script><script type="module">
import {createMeasuredElizabethTower} from '/app/js/world/elizabeth-tower-structure.js';
import {createHistoricWallMaterial} from '/app/js/world/historic-wall-material.js';
import {getBuildingMaterial} from '/app/js/engine/building-facade-materials.js';
import {attachBuildingFacadeLayout} from '/app/js/world/building-facade-layout.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(960,640);renderer.outputEncoding=THREE.sRGBEncoding;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc4d5e4);scene.add(new THREE.HemisphereLight(0xffffff,0x77736b,1));const sun=new THREE.DirectionalLight(0xfff3df,1);sun.position.set(-10,20,18);scene.add(sun);

const material=getBuildingMaterial({renderer},'ruins',123,0xaaaaaa,{tags:{building:'ruins',historic:'ruins'},heightMeters:1.6,footprintWidth:8,footprintDepth:4,footprintArea:32,lodTier:'near'});attachBuildingFacadeLayout(geometry,material.userData.exteriorProfile);scene.add(new THREE.Mesh(geometry,material));

</script>
