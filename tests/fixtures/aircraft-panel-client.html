<!doctype html><meta charset="utf-8"><title>Aircraft source component check</title>
<link rel="stylesheet" href="/app/styles/interface-v4.css"><style>body{margin:24px;background:#0b1722;color:#e4f3fc;font:16px/1.55 system-ui;max-width:840px}#details{max-width:640px}button{color:inherit;background:#214b66;padding:10px}h1{font-size:24px}</style>
<h1>Aircraft observations — source component check</h1><p>Controlled observations. Arrow Right changes coverage; this uses the actual game renderer.</p><button id="next">Change coverage →</button><div id="details"></div>
<script type="module">
import {renderLiveEarthDetails} from '/app/js/live-earth/controller-ui.js';
const details=document.getElementById('details');let phase=0;
const observation={id:'sample',label:'Sample flight',lat:39.3,lon:-76.6,dataSource:'adsb-lol',routeLabel:'ADSB.lol observation',routeSummary:'Current aircraft state vector observed by ADSB.lol.',region:'10 km from selected point',speedKt:180,headingDeg:45,observedAt:'2026-10-05T21:00:00Z',meta:'3,048 m • 180 kt'};let selected;
const ctx={escapeHtml:value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),selectorSelection:()=>null,selectedAircraft:()=>selected,setDetailsHtml:(_state,html)=>details.innerHTML=html};
function draw(){selected={...observation};if(phase===1)Object.assign(selected,{speedKt:null,headingDeg:null,observedAt:'',meta:'Altitude unavailable • -- kt'});if(phase===2)Object.assign(selected,{dataSource:'reference',label:'Reference flight',routeLabel:'Northeast corridor',routeSummary:'Modeled route reference',progressPct:20,meta:'Reference marker'});renderLiveEarthDetails(ctx,{selector:{ui:{details}},activeLayerId:'aircraft',aircraftItems:[selected],aircraftRoutes:phase===2?[{}]:[],aircraftSourceMode:phase===2?'reference':'observed',aircraftError:phase===2?'Live ADS-B is unavailable.':''});}
function next(){phase=(phase+1)%3;draw();}document.getElementById('next').onclick=next;window.addEventListener('keydown',e=>{if(e.code==='ArrowRight'){e.preventDefault();next();}});
window.render_game_to_text=()=>JSON.stringify({evidenceScope:'Actual source renderer; controlled observations, not live provider or physical-device evidence',phase,text:details.textContent});window.advanceTime=async()=>{};draw();
</script>
