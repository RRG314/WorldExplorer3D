<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#b5cbd4;color:#172a2d;font:15px system-ui}canvas{display:block}p{margin:8px}</style><p id="mode">Native curved pavement · Right compares original smooth shading, corrected creases and mesh edges.</p>
<script src="/app/vendor/three/build/three.min.js"></script><script type="module">
import {createDaytonaPavementSection} from './daytona-pavement-section.js';
import {applyRoadCreaseNormals} from '/app/js/terrain/road-crease-normals.js';
const f=await createDaytonaPavementSection(),scene=new THREE.Scene();scene.background=new THREE.Color('#b5cbd4');scene.add(new THREE.HemisphereLight(0xe7eff5,0x6c6e52,.65));const sun=new THREE.DirectionalLight(0xfff5df,.8);sun.position.set(320,300,-540);scene.add(sun);
const geometries=[],roadMeshes=[];function geometry(p,i){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setIndex(new THREE.BufferAttribute(i,1));g.computeVertexNormals();geometries.push(g);return g;}
scene.add(new THREE.Mesh(geometry(f.terrain.positions,f.terrain.indices),new THREE.MeshStandardMaterial({color:0x707862,roughness:1})));
const smooth=new THREE.MeshStandardMaterial({color:0x222a2e,roughness:1});const edges=new THREE.MeshBasicMaterial({color:0xc9be83,wireframe:true});for(const b of f.batches){const base=geometry(b.positions,b.indices),creased=base.clone();applyRoadCreaseNormals(creased);const m=new THREE.Mesh(base,smooth);m.userData.comparison={base,creased};scene.add(m);roadMeshes.push(m);}
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=THREE.sRGBEncoding;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(50,12/7,.1,1500);camera.position.set(480,17,-615);camera.lookAt(406,8,-643);let renderMode=0;function draw(){for(const m of roadMeshes){m.geometry=renderMode===0?m.userData.comparison.base:m.userData.comparison.creased;m.material=renderMode===2?edges:smooth;}document.getElementById('mode').textContent=['Native curved pavement · Smooth vertex normals','Native curved pavement · Corrected crease normals','Native curved pavement · Uploaded triangle edges'][renderMode];renderer.render(scene,camera);}addEventListener('keydown',e=>{if(e.code==='ArrowRight'){renderMode=(renderMode+1)%3;draw();}});window.advanceTime=draw;window.render_game_to_text=()=>JSON.stringify({renderMode,triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,glError:renderer.getContext().getError()});draw();
</script>
