<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;overflow:hidden;background:#bbd1da;font:16px system-ui}#status{position:fixed;top:15px;left:15px;padding:14px;color:#fff;background:#172d31e8}canvas{display:block}</style><div id="status">Controlled rolling format</div>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script><script type="module">
import {createOvalFormatFixture} from './oval-format.js';
import {createRaceSession} from '/app/js/racing/session-rules.js';
import {raceAiActions} from '/app/js/racing/ai-controller.js';
const controlCheck=new URLSearchParams(location.search).has('control');
import {createRaceVehicleProfile} from '/app/js/racing/vehicle-controller.js';
import {roadPavementNodeFrames} from '/app/js/world/road-pavement-coordinate-frame.js';
import {attachCuratedTrafficVehicle,syncCuratedVehicleGroundPivot,disposeCuratedTrafficVehicle} from '/app/js/urban-sandbox/curated-traffic-vehicle.js';
import {updateVehicleWheels} from '/app/js/transport/vehicle-wheel-motion.js';
import {buildRacePaint} from '/app/js/racing/course-markings.js';
import {createRoadMarkingMaterial} from '/app/js/road-render.js?v=4';
const T=THREE,{course}=createOvalFormatFixture(),scene=new T.Scene();scene.background=new T.Color('#bbd1da');scene.fog=new T.Fog('#bbd1da',500,1600);scene.add(new T.HemisphereLight(0xeaf4ff,0x606846,.8));const sun=new T.DirectionalLight(0xfff0d9,1.1);sun.position.set(200,500,100);scene.add(sun);
const grass=new T.Mesh(new T.PlaneGeometry(2200,2200),new T.MeshStandardMaterial({color:0x6c8050,roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.y=-.03;scene.add(grass);
const normals=roadPavementNodeFrames(course.points,{start:course.points.at(-2),end:course.points[1]}),positions=[],uvs=[];let distance=0;
for(let i=1;i<course.points.length;i++){const a=course.points[i-1],b=course.points[i],length=Math.hypot(b.x-a.x,b.z-a.z);for(const [index,l]of [[i-1,-5],[i-1,15],[i,15],[i-1,-5],[i,15],[i,-5]]){const p=course.points[index],n=normals[index];positions.push(p.x-n.x*l,0,p.z-n.z*l);uvs.push(l/3,(distance+(index===i?length:0))/3);}distance+=length;}
const roadGeometry=new T.BufferGeometry();roadGeometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));roadGeometry.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));roadGeometry.computeVertexNormals();
const asphalt=await new T.TextureLoader().loadAsync('/app/assets/textures/earth/asphalt_track_diffuse.jpg');asphalt.encoding=T.sRGBEncoding;asphalt.wrapS=asphalt.wrapT=T.RepeatWrapping;asphalt.anisotropy=8;const road=new T.Mesh(roadGeometry,new T.MeshStandardMaterial({map:asphalt,roughness:1,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));road.renderOrder=2;scene.add(road);
const paint=buildRacePaint(course),paintGeometry=new T.BufferGeometry();paintGeometry.setAttribute('position',new T.BufferAttribute(paint.positions,3));paintGeometry.setAttribute('color',new T.BufferAttribute(paint.colors,3));paintGeometry.computeVertexNormals();const marking=new T.Mesh(paintGeometry,createRoadMarkingMaterial({vertexColors:true,color:0xffffff,emissive:0,emissiveIntensity:0,depthWrite:false,side:T.DoubleSide},T));marking.renderOrder=4;scene.add(marking);
const session=createRaceSession({id:'controlled-rolling',course,creatorUid:'driver',createdAtMs:0}),hosts=new Map();for(const [i,uid]of ['driver','rival:one','rival:two','rival:three'].entries()){
 session.add({uid,profile:createRaceVehicleProfile('bmw_m3_e92_race'),ai:i>0});const host=new T.Group();if(!await attachCuratedTrafficVehicle(T,host,{variantId:'bmw_m3_e92_race',color:[0x426b9b,0xa14536,0x879298,0x253f37][i]}))throw Error('Licensed vehicle unavailable');scene.add(host);hosts.set(uid,host);
}session.setReady('driver',true);session.start('driver',0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);if(controlCheck)renderer.domElement.toDataURL=()=>'';const camera=new T.PerspectiveCamera(55,12/7,.1,1800),held=new Set();let now=0,sequence=0;
function draw(dt=0){const snapshot=session.presentationSnapshot();for(const p of snapshot.players){const host=hosts.get(p.uid),v=p.vehicleState;host.position.set(v.x,v.y,v.z);host.rotation.set(v.terrainPitch,v.angle,v.terrainRoll,'YXZ');syncCuratedVehicleGroundPivot(host);updateVehicleWheels(host.userData.curatedTrafficVehicleAttachment?.visual.userData.wheels||[],v.vFwd*.22352*dt,v.steerAngle);}const me=snapshot.players.find(p=>p.uid==='driver').vehicleState,f={x:Math.sin(me.angle),z:Math.cos(me.angle)};camera.position.set(me.x-f.x*16+f.z*11,me.y+7,me.z-f.z*16-f.x*11);camera.lookAt(me.x+f.x*8,me.y-.4,me.z+f.z*8);document.getElementById('status').textContent=snapshot.phase==='countdown'?'Rolling formation · '+Math.max(1,Math.ceil((4000-now)/1000)):snapshot.raceControl.flag==='yellow'?'Yellow · 22 MPH pace · no passing':'Green · driver input active';renderer.render(scene,camera);}
addEventListener('keydown',e=>held.add(e.code));addEventListener('keyup',e=>held.delete(e.code));window.advanceTime=ms=>{for(let left=ms;left>1e-6;){const dt=Math.min(1/60,left/1000);now+=dt*1000;session.control('driver',sequence++,{throttle:held.has('ArrowUp')?1:0,steer:held.has('ArrowLeft')?-1:0},now);session.advance(now);left-=dt*1000;}draw(ms/1000);};
window.render_game_to_text=()=>{const s=session.snapshot();return JSON.stringify({scope:'Controlled oval format and shared licensed vehicles; no native venue, record or hardware acceptance',now,phase:s.phase,raceControl:s.raceControl,players:s.players.map(p=>({uid:p.uid,x:p.pose.x,z:p.pose.z,speed:p.speed,gate:p.progress.nextGate,contacts:p.barrierContacts,zone:p.trackZone,penaltyMs:p.progress.penaltyMs})),glError:renderer.getContext().getError()});};addEventListener('pagehide',()=>{session.cancel();for(const host of hosts.values())disposeCuratedTrafficVehicle(host);roadGeometry.dispose();paintGeometry.dispose();road.material.dispose();asphalt.dispose();marking.material.dispose();grass.geometry.dispose();grass.material.dispose();renderer.dispose();});if(controlCheck){for(now=50;now<=6500;now+=50){const p=session.snapshot().players.find(p=>p.uid==='driver');session.control('driver',sequence++,p.progress?raceAiActions(course,p.vehicleState,p.progress,createRaceVehicleProfile('bmw_m3_e92_race')):{},now);session.advance(now);}now=6500;}draw();
</script>
