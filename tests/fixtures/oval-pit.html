<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;overflow:hidden;background:#bbd1da;font:16px system-ui}#status{position:fixed;top:15px;left:15px;padding:14px;color:white;background:#172d31e8}canvas{display:block}</style><div id="status">Controlled pit branch · Right to advance</div>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script><script type="module">

const circuit=new URLSearchParams(location.search).get('discipline')==='circuit',T=THREE,{course}=circuit?createCircuitPitFixture():createOvalPitFixture(),pit=createRacePitGeometry(course),profile=createRaceVehicleProfile('bmw_m3_e92_race'),scene=new T.Scene();scene.background=new T.Color('#bbd1da');scene.fog=new T.Fog('#bbd1da',500,1600);scene.add(new T.HemisphereLight(0xeaf4ff,0x606846,.8));const sun=new T.DirectionalLight(0xfff0d9,1.1);sun.position.set(200,500,100);scene.add(sun);
const grass=new T.Mesh(new T.PlaneGeometry(2200,2200),new T.MeshStandardMaterial({color:0x6c8050,roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.y=-.03;scene.add(grass);
const asphalt=await new T.TextureLoader().loadAsync('/app/assets/textures/earth/asphalt_track_diffuse.jpg');asphalt.encoding=T.sRGBEncoding;asphalt.wrapS=asphalt.wrapT=T.RepeatWrapping;asphalt.anisotropy=8;
const roadMaterial=new T.MeshStandardMaterial({map:asphalt,roughness:1,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),white=createRoadMarkingMaterial({color:0xffffff,emissive:0,emissiveIntensity:0,depthWrite:false,side:T.DoubleSide},T),geometries=[];
function ribbon(points,lo,hi,y,material,closed=false){const normals=roadPavementNodeFrames(points,closed?{start:points.at(-2),end:points[1]}:{}),positions=[],uvs=[];let distance=0;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],length=Math.hypot(b.x-a.x,b.z-a.z);for(const [index,l]of [[i-1,lo],[i-1,hi],[i,hi],[i-1,lo],[i,hi],[i,lo]]){const p=points[index],n=normals[index];positions.push(p.x-n.x*l,y,p.z-n.z*l);uvs.push(l/3,(distance+(index===i?length:0))/3);}distance+=length;}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(positions,3));g.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));g.computeVertexNormals();geometries.push(g);const mesh=new T.Mesh(g,material);mesh.renderOrder=material===white?4:2;scene.add(mesh);}
ribbon(course.points,circuit?-10:-5,circuit?10:15,0,roadMaterial,true);ribbon(pit.pitPavement.points,-6,6,.003,roadMaterial);for(const side of [-1,1])ribbon(pit.pitPavement.points,side*5.85-.055,side*5.85+.055,.014,white);
const paint=buildRacePaint(course),paintGeometry=new T.BufferGeometry();paintGeometry.setAttribute('position',new T.BufferAttribute(paint.positions,3));paintGeometry.setAttribute('color',new T.BufferAttribute(paint.colors,3));paintGeometry.setAttribute('markingStroke',new T.BufferAttribute(paint.strokeCoverage,4));paintGeometry.computeVertexNormals();geometries.push(paintGeometry);const paintMaterial=createRoadMarkingMaterial({vertexColors:true,color:0xffffff,emissive:0,emissiveIntensity:0,depthWrite:false,side:T.DoubleSide,filteredStroke:true},T),marking=new T.Mesh(paintGeometry,paintMaterial);marking.renderOrder=4;scene.add(marking);
const session=createRaceSession({id:'controlled-pit-view',course,creatorUid:'driver',createdAtMs:0}),hosts=new Map();for(const [i,uid]of ['driver','rival:one','rival:two','rival:three'].entries()){session.add({uid,profile,ai:i>0});const host=new T.Group();if(!await attachCuratedTrafficVehicle(T,host,{variantId:'bmw_m3_e92_race',color:[0x426b9b,0xa14536,0x879298,0x253f37][i],preserveSourcePaint:true}))throw Error('Licensed vehicle unavailable');scene.add(host);hosts.set(uid,host);}session.setReady('driver',true);session.start('driver',0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);renderer.domElement.toDataURL=()=>'';const camera=new T.PerspectiveCamera(55,12/7,.1,1800);let now=0,sequence=0,stage=-1;
function draw(){const snapshot=session.presentationSnapshot();for(const p of snapshot.players){const host=hosts.get(p.uid),v=p.vehicleState;host.position.set(v.x,v.y,v.z);host.rotation.set(v.terrainPitch,v.angle,v.terrainRoll,'YXZ');syncCuratedVehicleGroundPivot(host);}const me=snapshot.players.find(p=>p.uid==='driver'),v=me.vehicleState,f={x:Math.sin(v.angle),z:Math.cos(v.angle)};camera.position.set(v.x-f.x*12+f.z*7,v.y+5,v.z-f.z*12-f.x*7);camera.lookAt(v.x+f.x*8,v.y-.3,v.z+f.z*8);document.getElementById('status').textContent=stage<0?'Controlled pit branch · Right to advance':me.pit.active?`${circuit?'Circuit pit · 60 KM/H game limit':'Oval pit · 22 MPH pace'} · checkpoint ${me.pit.nextGate}/${me.pit.gates}`:`Pit exit · main timing continues · gate ${me.progress.nextGate}`;renderer.render(scene,camera);}
function next(){if(stage>=2)return;stage++;const until=now+120000;let reached=false;while(now<until){const p=session.snapshot().players.find(p=>p.uid==='driver');now+=50;session.control('driver',sequence++,ovalPitDriverActions(course,pit,p,profile),now);const s=session.advance(now),me=s.players.find(p=>p.uid==='driver');for(const q of s.players){const wheels=hosts.get(q.uid).userData.curatedTrafficVehicleAttachment?.visual.userData.wheels||[];updateVehicleWheels(wheels,q.vehicleState.vFwd*.22352*.05,q.vehicleState.steerAngle);}if(stage===0&&me.pit.active||stage===1&&me.pit.active&&me.pit.nextGate>=9||stage===2&&me.pit.visits===1&&!me.pit.active){reached=true;break;}if(me.dnf||s.phase==='complete')break;}if(!reached)throw Error('Controlled pit stage not reached');draw();}
addEventListener('keydown',e=>{if(e.code==='ArrowRight')next();});window.advanceTime=draw;window.render_game_to_text=()=>{const s=session.snapshot(),p=s.players.find(p=>p.uid==='driver');return JSON.stringify({discipline:course.discipline,physicsVersion:racePhysicsVersion(course),scope:'Controller-driven entry, mid-pit and exit through the owned session; controlled geometry, not native venue or steady human-input acceptance',stage,now,phase:s.phase,pit:p.pit,gate:p.progress.nextGate,lap:p.progress.lap,pose:p.pose,speedMetersPerSecond:raceVehicleSpeedMetersPerSecond(p.vehicleState),contacts:p.barrierContacts,penaltyMs:p.progress.penaltyMs,draft:p.draftingReduction,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,glError:renderer.getContext().getError()});};addEventListener('pagehide',()=>{session.cancel();for(const host of hosts.values())disposeCuratedTrafficVehicle(host);for(const g of geometries)g.dispose();for(const m of [roadMaterial,white,paintMaterial,grass.material])m.dispose();grass.geometry.dispose();asphalt.dispose();renderer.dispose();});draw();
