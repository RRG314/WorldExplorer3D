<script src="/node_modules/three/build/three.min.js"></script><script type="module">
import {opaqueFrontToBack} from '/app/js/engine/opaque-order.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x578498);const camera=new THREE.PerspectiveCamera(55,4/3,.1,100);camera.position.set(0,3,13);camera.lookAt(0,1,0);
scene.add(new THREE.HemisphereLight(0xabcdef,0x554433,1));const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(3,8,4);scene.add(light);
