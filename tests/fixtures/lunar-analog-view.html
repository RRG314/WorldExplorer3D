<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lunar analog presentation verification</title><link rel="icon" href="/favicon.svg">
<style>body{margin:0;background:#101822;font:16px system-ui;color:#f3f1df}canvas{display:block;max-width:100vw}aside{position:fixed;top:12px;left:12px;max-width:calc(100vw - 48px);box-sizing:border-box;background:#122c33;padding:12px;border:1px solid #7baaa6;border-radius:10px}button{font:inherit;padding:8px;color:#102b24;background:#f4d57b;border:0;border-radius:5px}</style>
<aside><strong id="siteLabel"></strong><p>Authored game analog · composition and age unmeasured</p><button id="siteA">Site A</button> <button id="siteB">Site B</button></aside>
<script src="/app/vendor/three/build/three.min.js"></script><script type="module">
import {ctx} from '/app/js/shared-context.js?v=55';
import {activatePlanetaryFieldActivities,clearPlanetaryFieldActivities} from '/app/js/planetary/field-activities.js';
import {lunarFieldPlan} from '/app/js/planetary/lunar-survey.js';
import {applyDisplayColorPolicy} from '/app/js/engine/display-color-policy.js';
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.06,600),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);applyDisplayColorPolicy(renderer,T);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.prepend(renderer.domElement);scene.background=new T.Color('#101822');scene.add(new T.HemisphereLight(0xf1f5ff,0x4b453c,.55));const sun=new T.DirectionalLight(0xfff4df,.65);sun.position.set(20,30,-10);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(260,260),new T.MeshStandardMaterial({color:0x878480,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(-20,-.015,30);scene.add(floor);
Object.assign(ctx,{scene,camera,renderer,onMoon:true,getEnv:()=> 'MOON',Walk:{state:{mode:'walk',walker:{x:0,y:1.7,z:0}}}});
const world={objects:[]},pack={bodyId:'moon',spawn:{x:0,z:0},manifest:{regionId:'controlled-native-analog-presentation',renderPlacement:{y:0},truthClass:'authored'},fieldNotes:lunarFieldPlan('observe')};
activatePlanetaryFieldActivities(pack,world,()=>0);let selected='a';
function focus(id){selected=id;const root=world.objects.find(o=>o.userData.lunarAnalog===(id==='a'?'basalt':'breccia'));camera.position.set(root.position.x+2.55,root.position.y+2.3,root.position.z-2.5);camera.lookAt(root.position.x,root.position.y+.45,root.position.z);document.getElementById('siteLabel').textContent=id==='a'?'Site A · dark fine-grained basalt analog':'Site B · coarse fragments in a finer breccia matrix';renderer.render(scene,camera);}
document.getElementById('siteA').onclick=()=>focus('a');document.getElementById('siteB').onclick=()=>focus('b');
function snapshot(){return {scope:'Controlled actual native rig geometry and visual contrast only; not lunar field work',selected,sites:world.objects.filter(o=>o.userData.lunarAnalog).map(o=>{const host=o.getObjectByName('lunar-'+o.userData.lunarAnalog+'-matrix');o.updateMatrixWorld(true);const b=new T.Box3().setFromObject(host);return {kind:o.userData.lunarAnalog,footClearance:b.min.y,matrixColor:host.material.color.getHexString(),grains:o.children.filter(n=>/^lunar-(?:fine-grain|embedded-fragment)$/.test(n.name)).length};})};}
window.render_game_to_text=()=>JSON.stringify(snapshot());window.advanceTime=async()=>renderer.render(scene,camera);window.lunarAnalogView={snapshot,dispose(){clearPlanetaryFieldActivities();const gs=new Set(),ms=new Set();for(const o of world.objects){o.parent?.remove(o);o.traverse(n=>{if(n.geometry)gs.add(n.geometry);for(const m of [].concat(n.material||[]))ms.add(m);});}for(const g of gs)g.dispose();for(const m of ms)m.dispose();return {removed:world.objects.every(o=>!o.parent),geometries:gs.size,materials:ms.size};}};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);focus(selected);});focus('a');window.ready=true;
</script></html>
