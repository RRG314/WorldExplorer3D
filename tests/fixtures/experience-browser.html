<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Activities presentation check</title><link rel="stylesheet" href="/app/styles/experiences.css"><style>body{background:#101e1a;color:#f3f0e4;font:16px system-ui;margin:24px}button{min-height:44px}#result{max-width:40rem}</style><button id="open">Activities</button><p id="result"></p><script type="module">
import {createExperienceBrowser} from '/app/js/ui/experience-browser.js';
let profile={activeExperience:{experienceId:'career:racer'}};
const places=[{id:'practice',name:'Practice grounds',environment:'earth',lat:51,lon:0}];
const adapter={equipment:'Choose your car and check its condition.',places:()=>places,offer:({place})=>({state:place?'ready':'needs-place',label:place?'Choose an event':'Choose a place',enabled:!!place}),summary:()=>({stages:[{label:'Prepare your car'},{label:'Finish an event'},{label:'Review your saved result'}]})};
const browser=createExperienceBrowser({readProfile:async()=>profile,saveSelection:async intent=>{profile={...profile,activeExperience:intent};},resolveAdapter:(id)=>['racing','game','route'].includes(id)?adapter:null,onBegin:async()=>false});
document.querySelector('#open').onclick=()=>browser.open();
window.render_game_to_text=()=>JSON.stringify({scope:'actual Activities presentation; gameplay adapters are isolated',...browser.snapshot(),heading:document.querySelector('.experience-detail h3')?.textContent});
window.advanceTime=async()=>{};
</script></html>
