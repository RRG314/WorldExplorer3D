<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Activities presentation check</title><link rel="stylesheet" href="/app/styles/experiences.css"><style>body{background:#101e1a;color:#f3f0e4;font:16px system-ui;margin:24px}button{min-height:44px}#result{max-width:40rem}</style><button id="open">Activities</button><p id="result"></p><script type="module">
import {soloRacerSummary} from '/app/js/campaign/solo-racer.js';
import {createExperienceBrowser} from '/app/js/ui/experience-browser.js';
const check=window.experienceCheck={allowStart:new URLSearchParams(location.search).has('ready'),entered:0,walkKeys:0};
const canvas=document.createElement('canvas');canvas.id='world';canvas.tabIndex=0;canvas.width=64;canvas.height=64;canvas.setAttribute('aria-label','World input check');document.body.append(canvas);canvas.addEventListener('keydown',event=>{if(event.code==='KeyW')check.walkKeys++;});
let profile={activeExperience:{experienceId:'career:racer'}};
const places=[{id:'practice',name:'Practice grounds',environment:'earth',lat:51,lon:0}];
const adapter={equipment:'Choose your car and check its condition.',places:()=>places,offer:({place})=>({state:place?'ready':'needs-place',label:place?'Choose an event':'Choose a place',enabled:!!place}),summary:({profile,variantId})=>soloRacerSummary(profile?.soloRacer,{variantId})};
const browser=createExperienceBrowser({readProfile:async()=>profile,saveSelection:async intent=>{profile={...profile,activeExperience:intent};},resolveAdapter:(id)=>['racing','game','route'].includes(id)?adapter:null,onBegin:async()=>check.allowStart,onEntered:()=>{check.entered++;canvas.focus();}});
document.querySelector('#open').onclick=()=>browser.open();
window.render_game_to_text=()=>JSON.stringify({scope:'actual Activities presentation; gameplay adapters are isolated',...browser.snapshot(),heading:document.querySelector('.experience-detail h3')?.textContent,entered:check.entered,walkKeys:check.walkKeys,worldFocused:document.activeElement===canvas});
window.advanceTime=async()=>{};
if(check.allowStart)void browser.open({experienceId:'career:racer'});
</script></html>
