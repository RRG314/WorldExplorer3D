<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">
<style>body{margin:0;background:#b8ced9;color:#172a2d;font:15px system-ui}canvas{display:block}p{margin:8px}</style>
<p>Controlled pavement geometry · Right cycles apron, bank and overview.</p>
<script src="/app/vendor/three/build/three.min.js"></script>
<script type="module">
import {createPavementSectionsFixture} from './pavement-sections.js';
import {createRoadContactIndex} from '/app/js/terrain/road-contact-index.js';
const f=await createPavementSectionsFixture(),scene=new THREE.Scene();scene.background=new THREE.Color('#b8ced9');scene.add(new THREE.HemisphereLight(0xf4f7fb,0x687052,.9));const sun=new THREE.DirectionalLight(0xfff6e3,1.1);sun.position.set(30,70,25);scene.add(sun);
function mesh(p,i,material){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setIndex(new THREE.BufferAttribute(i,1));g.computeVertexNormals();const m=new THREE.Mesh(g,material);scene.add(m);return m;}
const terrain=mesh(f.terrain.meshes[0].positions,f.terrain.meshes[0].indices,new THREE.MeshStandardMaterial({color:0x71815d,roughness:1})),asphalt=new THREE.MeshStandardMaterial({color:0x41464a,roughness:.95});
for(const b of f.batches)mesh(b.positions,b.indices,asphalt);
const contact=createRoadContactIndex(f.batches.map(b=>({geometry:{attributes:{position:{array:b.positions}},getIndex:()=>({array:b.indices})},userData:{terrainMode:'at_grade'}}))),renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true,antialias:true});renderer.setSize(1200,700);renderer.outputEncoding=THREE.sRGBEncoding;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(50,12/7,.1,300);let view=0;
function draw(){
 if(view===0){camera.position.set(38,531,63);camera.lookAt(3,500,20);}
 if(view===1){camera.position.set(13,499,43);camera.lookAt(1,500.5,15);}
 if(view===2){camera.position.set(-8,505,36);camera.lookAt(9,497,16);}
 renderer.render(scene,camera);
}
addEventListener('keydown',e=>{if(e.code==='ArrowRight'){view=(view+1)%3;draw();}});window.advanceTime=draw;window.render_game_to_text=()=>JSON.stringify({view,bankDegrees:31,positiveExtent:3,negativeExtent:15,bankKnee:-6,bankHeight:contact.sampleAt(0,20),apronHeight:contact.sampleAt(12,20),outsideContact:contact.sampleAt(16,20),triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,glError:renderer.getContext().getError()});draw();
</script>
