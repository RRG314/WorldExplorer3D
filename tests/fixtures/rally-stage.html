<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#c1d4df;font:16px system-ui}canvas{display:block}#status{position:fixed;top:16px;left:16px;max-width:650px;padding:14px;color:#fff;background:#182c32ed;line-height:1.5}button{padding:8px}</style><div id="status">Controlled rally motion · Right to advance</div>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script><script type="module">
import {createRallyStageFixture} from './rally-stage-format.js';
import {qualifyRallyStageAdmissionFixture} from './rally-stage-admission.js';
import {createPracticeRaceController} from '/app/js/racing/road-activity-controller.js';
import {advanceRoadRaceFrame} from '/app/js/physics/road-race-delegate.js';
import {createRaceVehicleProfile} from '/app/js/racing/vehicle-controller.js';
import {sampleRaceSegmentY} from '/app/js/racing/course-rules.js';
import {rallyPaceNoteText} from '/app/js/racing/rally-rules.js';
import {racePhysicsVersion} from '/app/js/racing/record-rules.js';
import {attachCuratedTrafficVehicle,syncCuratedVehicleGroundPivot,disposeCuratedTrafficVehicle} from '/app/js/urban-sandbox/curated-traffic-vehicle.js';
const admitted=new URLSearchParams(location.search).get('source-admission')==='1'?await qualifyRallyStageAdmissionFixture():null;
const T=THREE,course=admitted?admitted.events[0]:createRallyStageFixture().course,profile=createRaceVehicleProfile('bmw_m3_e92_race'),scene=new T.Scene();scene.background=new T.Color('#c1d4df');scene.add(new T.HemisphereLight(0xedf6ff,0x64774b,.9));const sun=new T.DirectionalLight(0xffeedc,1.2);sun.position.set(90,250,60);scene.add(sun);
const texture=await new T.TextureLoader().loadAsync('/app/assets/textures/earth/asphalt_track_diffuse.jpg');texture.encoding=T.sRGBEncoding;texture.wrapS=texture.wrapT=T.RepeatWrapping;texture.anisotropy=8;
const materials=['#525354','#998e74','#e0e7e9'].map(color=>new T.MeshStandardMaterial({map:texture,color,roughness:1,side:T.DoubleSide})),grassMaterial=new T.MeshStandardMaterial({color:0x73834e,roughness:1,side:T.DoubleSide}),geometries=[];
function band(segment,lo,hi,offset,material){const positions=[],uv=[];const count=Math.ceil(segment.lengthMeters/2),f=segment.forward;for(let i=0;i<count;i++)for(const [station,lateral]of [[i,lo],[i,hi],[i+1,hi],[i,lo],[i+1,hi],[i+1,lo]]){const t=station/count;positions.push(segment.a.x+(segment.b.x-segment.a.x)*t+f.z*lateral/course.metersPerUnit,sampleRaceSegmentY(segment,t)+offset,segment.a.z+(segment.b.z-segment.a.z)*t-f.x*lateral/course.metersPerUnit);uv.push(lateral/2,(segment.startMeters+segment.lengthMeters*t)/2);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(positions,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.computeVertexNormals();geometries.push(g);scene.add(new T.Mesh(g,material));}
if(admitted){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(admitted.positions,3));g.computeVertexNormals();geometries.push(g);scene.add(new T.Mesh(g,materials[0]));}
for(const [i,s]of course.segments.entries()){if(!admitted)band(s,-1.75,1.75,0,materials[i<2?0:i<4?1:2]);band(s,-22,-Math.max(1.75,s.widthMeters/2),-.03,grassMaterial);band(s,Math.max(1.75,s.widthMeters/2),22,-.03,grassMaterial);}
const context={worldPublication:{},car:{personalVehicleId:profile.vehicleId},Walk:{state:{mode:'drive'}},activateSurfaceActivity:()=>true},run=createPracticeRaceController({context,course,profile,rivals:[{profile,label:'Staggered rival',difficulty:.65}]});context.roadRaceController=run;run.start();const hosts=new Map();
for(const uid of [run.uid,'rival:0']){const host=new T.Group();if(!await attachCuratedTrafficVehicle(T,host,{variantId:'bmw_m3_e92_race',preserveSourcePaint:true}))throw Error('Real race vehicle unavailable');scene.add(host);hosts.set(uid,host);}
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);renderer.domElement.toDataURL=()=>'';const camera=new T.PerspectiveCamera(55,12/7,.1,1500);let stage=-1,flightSeen=false,landingSeen=false;
function draw(){const snapshot=run.presentationSnapshot(),me=snapshot.players.find(p=>p.uid===run.uid),v=me.vehicleState;for(const p of snapshot.players){const host=hosts.get(p.uid),s=p.vehicleState;host.position.set(s.x,s.y,s.z);host.rotation.set(s.terrainPitch,s.angle,s.terrainRoll,'YXZ');syncCuratedVehicleGroundPivot(host);}const f={x:Math.sin(v.angle),z:Math.cos(v.angle)};camera.position.set(v.x-f.x*9+f.z*6,v.y+2.5,v.z-f.z*9-f.x*6);camera.lookAt(v.x+f.x*3,v.y-.6,v.z+f.z*3);document.getElementById('status').textContent=`Controlled mixed-surface stage · ${admitted?(stage===0?'Published narrow public road':'Complete directed private interval and staggered finishes'):stage===0?'Supported crest flight':stage===1?'Landing and damage':stage===2?'Recovery +15s':stage===3?'Both staggered entrants finished':'Right to advance'} · Split ${me.rally.splits.length}/2 · Condition ${Math.round(me.condition*100)}% · ${rallyPaceNoteText(me)}`;renderer.render(scene,camera);}
function step(){const before=run.snapshot().players.find(p=>p.uid===run.uid).vehicleState.isAirborne;if(!advanceRoadRaceFrame(context,1/60,{throttle:1}))throw Error('Rally actor ownership lost');const p=run.snapshot().players.find(p=>p.uid===run.uid);flightSeen||=p.vehicleState.isAirborne;landingSeen||=before&&!p.vehicleState.isAirborne;return p;}
function next(){if(stage>=(admitted?1:3))return;stage++;if(admitted){let reached=false;for(let i=0;i<12000;i++){const p=step();if(stage===0&&p.progress.nextGate>=8||stage===1&&run.snapshot().phase==='complete'){reached=true;break;}}if(!reached)throw Error('Published stage milestone not reached');draw();return;}if(stage===2){run.recover();step();}else{let reached=false;for(let i=0;i<12000;i++){const p=step(),snapshot=run.snapshot();if(stage===0&&p.vehicleState.isAirborne&&p.vehicleState._terrainAirTimer>=.25||stage===1&&landingSeen&&p.progress.nextGate>=9||stage===3&&snapshot.phase==='complete'){reached=true;break;}}if(!reached)throw Error('Rally milestone not reached');}draw();}
addEventListener('keydown',e=>{if(e.code==='ArrowRight')next();});window.advanceTime=draw;window.render_game_to_text=()=>{const s=run.snapshot(),p=s.players.find(p=>p.uid===run.uid);return JSON.stringify({scope:'Controlled source, continuous throttle and existing session/actor owners; not a geographic pack, native-world, live-cloud or frame-pacing acceptance',stage,admission:admitted?{qualified:admitted.district.roads.length,rejected:admitted.district.diagnostics.rejected,sourcePath:course.sourcePath}:null,phase:s.phase,physicsVersion:racePhysicsVersion(course),flightSeen,landingSeen,pose:p.pose,vehicleState:p.vehicleState,contacts:p.barrierContacts,condition:p.condition,progress:p.progress,rally:p.rally,players:s.players.map(p=>({uid:p.uid,finished:p.progress.finished,startAt:p.rally.startAtMs,elapsedMs:p.progress.elapsedMs,condition:p.condition})),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,glError:renderer.getContext().getError()});};addEventListener('pagehide',()=>{run.dispose();admitted?.dispose();for(const host of hosts.values())disposeCuratedTrafficVehicle(host);for(const g of geometries)g.dispose();for(const material of [...materials,grassMaterial])material.dispose();texture.dispose();renderer.dispose();});draw();
</script>
