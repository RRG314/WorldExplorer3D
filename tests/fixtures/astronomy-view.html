<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width" /><link
    rel="icon"
    href="/favicon.svg"
  /><title>Observatory geometry verification</title>
  <style>
    body {
      margin: 0;
      background: #102028;
      color: #f2ead6;
      font: 15px system-ui;
    }
    canvas {
      position: fixed;
      inset: 0;
      max-width: 100vw;
    }
    aside {
      position: fixed;
      top: 12px;
      left: 12px;
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
      padding: 12px;
      background: #122c33;
      border: 1px solid #86b3a4;
      border-radius: 9px;
    }
    button {
      font: inherit;
      background: #f0ce75;
      color: #142f2b;
      padding: 8px;
      border: 0;
      border-radius: 5px;
    }
    pre {
      white-space: pre-wrap;
      font: 13px system-ui;
    }
  </style>
  <aside>
    <strong>Controlled native observatory</strong>
    <p>Actual meshes, supported feet and optical rays · no fieldwork claim</p>
    <button id="align">Align</button> <button id="dither">Dither</button>
    <button id="cover">Cover detector</button> <button id="block">Block the lens</button>
    <pre id="reading"></pre>
  </aside>
  <script src="/app/vendor/three/build/three.min.js"></script>
  <script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
  <script type="module">
    import { ctx } from '/app/js/shared-context.js?v=55';
    import { createAstronomyPresentation } from '/app/js/campaign/astronomy-presentation.js';
    import { astronomyHarness } from '/tests/helpers/astronomy-study.mjs';
    import {
      syntheticDetectorFrame,
      encodeDetectorFrame,
    } from '/app/js/campaign/astronomy-instrument.js';
    import { applyDisplayColorPolicy } from '/app/js/engine/display-color-policy.js';
    const T = THREE,
      u = 1.11,
      scene = new T.Scene(),
      camera = new T.PerspectiveCamera(52, innerWidth / innerHeight, 0.08, 100),
      renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    applyDisplayColorPolicy(renderer, T);
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    scene.background = new T.Color('#182b3b');
    document.body.prepend(renderer.domElement);
    scene.add(new T.HemisphereLight(0xe7f1ff, 0x5c6055, 0.7));
    const sun = new T.DirectionalLight(0xffedce, 0.9);
    sun.position.set(-10, 18, 4);
    scene.add(sun);
    const ground = (x, z) => 0.04 * x + 0.025 * z,
      terrainGeometry = new T.PlaneGeometry(30, 30, 1, 1);
    terrainGeometry.rotateX(-Math.PI / 2);
    const positions = terrainGeometry.attributes.position;
    for (let i = 0; i < positions.count; i++)
      positions.setY(i, ground(positions.getX(i), positions.getZ(i)));
    terrainGeometry.computeVertexNormals();
    scene.add(
      new T.Mesh(terrainGeometry, new T.MeshStandardMaterial({ color: 0x636f5c, roughness: 1 }))
    );
    const h = astronomyHarness(undefined, 'campaign', 'controlled-geometry-0001'),
      active = h.state.active,
      qualified = {
        metersPerUnit: u,
        site: active.site,
        points: Object.fromEntries(
          Object.entries({
            a: { x: -6 / u, z: 0 },
            b: { x: 6 / u, z: 0 },
            bench: { x: 0, z: 8 / u },
          }).map(([k, p]) => [k, { ...p, y: ground(p.x, p.z) }])
        ),
      };
    Object.assign(ctx, {
      scene,
      camera,
      renderer,
      dynamicBuildingColliders: [],
      SurfaceQuery: {
        walkAt: (x, z) => ({ position: { y: ground(x, z) } }),
        driveAt: (x, z) => ({ position: { y: ground(x, z) } }),
      },
      Walk: { state: { walker: { x: 0, y: 1.7, z: 0 } } },
    });
    const presentation = await createAstronomyPresentation(ctx, qualified, {}, {});
    presentation.update(active);
    let exampleFrame = null;
    const blocker = new T.Mesh(
      new T.BoxGeometry(0.6, 0.6, 0.08),
      new T.MeshStandardMaterial({ color: 0x8c3730, side: T.DoubleSide })
    );
    blocker.name = 'Controlled opaque optical blocker';
    scene.add(blocker);
    blocker.visible = false;
    function draw() {
      const p = qualified.points.a;
      camera.position.set(p.x + 3.1, p.y + 2.2, p.z + 3);
      camera.lookAt(p.x, p.y + 1.0, p.z);
      renderer.render(scene, camera);
      document.getElementById('reading').textContent = JSON.stringify(
        presentation.readOptics(true),
        null,
        2
      );
    }
    function align() {
      h.align();
      h.command({ type: 'configure', seconds: 2 });
      presentation.update(h.state.active);
      presentation.prepare('primary');
      const a = h.state.active,
        f = syntheticDetectorFrame({
          target: a.target,
          location: a.site.location,
          referenceTime: a.referenceTime,
          pointing: a.pointing,
          seconds: 2,
          seed: 54321,
        });
      exampleFrame = encodeDetectorFrame(f);
      presentation.showFrame(exampleFrame);
      draw();
    }
    document.getElementById('align').onclick = () => {
      if (h.state.active.phase === 'align') align();
    };
    document.getElementById('cover').onclick = () => {
      presentation.prepare('dark');
      draw();
    };
    document.getElementById('dither').onclick = () => {
      const a = structuredClone(h.state.active);
      a.variantId = 'detector-dither';
      a.phase = 'controls';
      a.frames.primary = { image: exampleFrame };
      presentation.update(a);
      presentation.prepare('comparison');
      draw();
    };
    document.getElementById('block').onclick = () => {
      const r = presentation.readOptics(true);
      blocker.visible = !blocker.visible;
      blocker.position.set(
        r.origin.x + r.axis.x * 2,
        r.origin.y + r.axis.y * 2,
        r.origin.z + r.axis.z * 2
      );
      blocker.lookAt(new T.Vector3(r.origin.x, r.origin.y, r.origin.z));
      blocker.updateMatrixWorld(true);
      draw();
    };
    window.astronomyView = {
      lookAtDetector() {
        const p = qualified.points.b;
        camera.position.set(p.x, p.y + 1.4, p.z + 1.9);
        camera.lookAt(p.x, p.y + 1.14, p.z);
        renderer.render(scene, camera);
      },
      presentation,
      h,
      ctx,
      qualified,
      blocker,
      draw,
      snapshot() {
        const r = presentation.readOptics(true);
        return {
          scope: 'Controlled actual native geometry only',
          reading: r,
          budget: presentation.budget(),
          feet: presentation.feet.map(({ object, groundY }) => {
            object.updateWorldMatrix(true, false);
            return new T.Box3().setFromObject(object).min.y - groundY;
          }),
          proxies: ctx.dynamicBuildingColliders.length,
          phase: h.state.active.phase,
        };
      },
    };
    window.render_game_to_text = () => JSON.stringify(astronomyView.snapshot());
    window.advanceTime = async () => draw();
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      draw();
    });
    draw();
    window.ready = true;
  </script>
</html>
