<!doctype html><html><head><meta charset="utf-8"><title>Game result save/retry inspection</title><link rel="stylesheet" href="/app/styles/runtime-shell.css"><style>body{margin:0;background:#23404a;font:16px system-ui}</style></head><body><div id="resultScreen" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="resultBox"><div id="resultTitle"></div><div id="resultStats"></div><p id="resultJournalStatus" role="status"></p><button class="pauseBtn" id="resultJournalRetry" hidden>Retry Journal save</button><button class="pauseBtn" id="againBtn">Play Again</button><button class="pauseBtn" id="freeBtn">Free Roam</button></div></div><script type="module">
import {createGameResultController} from '/app/js/gameplay/result-controller.js';import {createActivityCompletionStore} from '/app/js/activity-discovery/completion.js';
let attempts=0,paused=false,replays=0;const disk=new Map(),store=createActivityCompletionStore({storage:()=>({getItem:k=>disk.get(k),setItem:(k,v)=>disk.set(k,v)}),recordEvent:async event=>{if(++attempts===1)throw Error('Controlled save failure');return {recorded:true,event}}});
const result=createGameResultController({gameMode:'trial',gameTimer:92,setPauseReason:(_r,p)=>paused=p,startMode:()=>{replays++;return true}},{completions:store});
document.getElementById('againBtn').onclick=()=>result.replay();document.getElementById('freeBtn').onclick=()=>result.hide();await result.show('Destination reached','Time: 01:32');
window.render_game_to_text=()=>JSON.stringify({scene:'actual common result controller and styles; controlled Journal boundary',result:result.snapshot(),attempts,paused,replays,retryVisible:!document.getElementById('resultJournalRetry').hidden});window.advanceTime=async()=>{};
</script></body></html>
