<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Geology station presentation check</title><link rel="stylesheet" href="/app/styles/experiences.css"><style>body{background:#101e1a;color:#f3f0e4;font:16px system-ui;padding:24px}#open{min-height:44px;padding:10px 20px}</style><button id="open" disabled>Open station</button><script type="module">
import {createIndexedDbDiscoveryProfileStore} from '/app/js/discovery/profile-store.js';
import {createGeologyUI,geologyTarget} from '/app/js/campaign/geology-ui.js';
const site={id:'virtual-geology:fixture',name:'Virtual geology field course',truthType:'virtual-training-site',location:{lat:39.3189,lon:-76.6363},points:{a:{lat:39.3189,lon:-76.6363},b:{lat:39.3189,lon:-76.6361},bench:{lat:39.319,lon:-76.6362}}};

</script></html>
