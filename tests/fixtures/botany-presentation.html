<!doctype html><meta charset="utf-8" /><meta name="viewport" content="width=device-width" /><link
  rel="icon"
  href="/favicon.svg"
/><title>Botany presentation boundary</title
><style>
  body {
    margin: 0;
  }
  canvas {
    display: block;
  }
  p {
    position: fixed;
    left: 12px;
    top: 12px;
    color: #fff;
    background: #123125;
    padding: 10px;
    font: 14px system-ui;
  }
</style>
<p>Controlled virtual plant beds · presentation and instrument boundary only</p>
<script src="/app/vendor/three/build/three.min.js"></script>
<script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
  import { sampleFieldSurfacePoints } from '/app/js/campaign/field-surface-samples.js';
  import { createBotanyPresentation } from '/app/js/campaign/botany-presentation.js';
  import { BOTANY_OFFSETS, BOTANY_STUDIES } from '/app/js/campaign/botany-career.js';
  import { inspectFieldPhoto } from '/app/js/campaign/field-photo-tool.js';
  import { applyDisplayColorPolicy } from '/app/js/engine/display-color-policy.js';
  import { botanySite } from '/tests/helpers/botany-study.mjs';
  const T = THREE,
    scene = new T.Scene(),
    camera = new T.PerspectiveCamera(58, innerWidth / innerHeight, 0.08, 160),
    renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  applyDisplayColorPolicy(renderer, T);
  scene.background = new T.Color('#c7d4d5');
  document.body.prepend(renderer.domElement);
  scene.add(new T.HemisphereLight(0xffffff, 0x66705a, 0.95));
  const sun = new T.DirectionalLight(0xfff2db, 1.2);
  sun.position.set(-5, 12, 6);
  scene.add(sun);
  const sloped = new URLSearchParams(location.search).has('slope'),
    heightAt = (x, z) => (sloped ? x * 0.03 + z * 0.02 : 0);
  const mat = new T.MeshStandardMaterial({ color: 0x6e8260, roughness: 0.95 });
  mat.color.convertSRGBToLinear();
  const ground = new T.Mesh(new T.PlaneGeometry(150, 150), mat);
  ground.geometry.rotateX(-Math.PI / 2);
  const vertices = ground.geometry.attributes.position;
  for (let i = 0; i < vertices.count; i++)
    vertices.setY(i, heightAt(vertices.getX(i), vertices.getZ(i)));
  ground.geometry.computeVertexNormals();
  scene.add(ground);
  const walker = { x: -6, y: 1.7, z: 1.4 },
    runtime = {
      scene,
      camera,
      renderer,
      METERS_PER_WORLD_UNIT: 1,
      Walk: { state: { walker } },
      dynamicBuildingColliders: [],
      getEnv: () => 'EARTH',
      getCurrentTravelMode: () => 'walk',
      getLiveGpsSnapshot: () => ({ active: false }),
      SurfaceQuery: {
        driveAt: (x, z) => ({
          kind: 'terrain',
          position: { y: heightAt(x, z) },
          provenance: { confidence: 1 }
        }),
        walkAt: (x, z) => ({ position: { y: heightAt(x, z) } })
      }
    },
    qualified = {
      site: botanySite(),
      metersPerUnit: 1,
      points: Object.fromEntries(
        Object.entries(BOTANY_OFFSETS).map(([id, p]) => [id, { ...p, y: heightAt(p.x, p.z) }])
      )
    };
  let presentation = null,
    state = null;
  async function setup(variantId) {
    presentation?.dispose();
    const study = BOTANY_STUDIES[variantId];
    state = {
      active: {
        runId: 'botany-visual-case',
        variantId,
        site: qualified.site,
        currentSeason: study.initialSeason,
        phase: 'plants',
        plantIndex: 0,
        captures: {},
        markedAt: 0,
        planting: null
      }
    };
    presentation = await createBotanyPresentation(runtime, qualified, study, {
      getState: () => state,
      isCurrent: () => true
    });
    return study;
  }
  function facePlant(id) {
    const p = qualified.points[id],
      objects = presentation.photoSubjects[`plant-${id}`].objects,
      b = new T.Box3();
    for (const o of objects) b.union(new T.Box3().setFromObject(o));
    Object.assign(walker, { x: p.x, y: 1.7, z: p.z + 1.4 });
    camera.position.set(walker.x, walker.y, walker.z);
    camera.lookAt(b.getCenter(new T.Vector3()));
    state.active.plantIndex = ['a', 'b', 'c'].indexOf(id);
    presentation.update(state.active);
    return inspectFieldPhoto(runtime, presentation.photoSubjects[`plant-${id}`], {
      acceptIntersection: presentation.opacity.accepts,
      sampleSurfacePoints: (root) =>
        sampleFieldSurfacePoints({ THREE: T, root, opacity: presentation.opacity })
    });
  }
  await setup('campaign');
  if (!sloped) facePlant('a');
  function loop() {
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.botanyVisual = {
    runtime,
    qualified,
    get presentation() {
      return presentation;
    },
    get state() {
      return state;
    },
    setup,
    facePlant
  };
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
