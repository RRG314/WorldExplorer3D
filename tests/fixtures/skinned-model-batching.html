import {batchSkinnedModelTemplate} from '/app/js/assets/skinned-model-batching.js';

const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(800,600);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172334);scene.add(new THREE.HemisphereLight(0xffffff,0x334466,1));const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(3,5,4);scene.add(sun);

 const {name,gltf}=templates[phase%templates.length],raw=cloneModelGraph(gltf.scene,{geometry:'shared',materials:'clone'}),optimized=cloneModelGraph(gltf.scene,{geometry:'shared',materials:'clone'});

 const stats=batchSkinnedModelTemplate(THREE,optimized,gltf.animations),bounds=new THREE.Box3().setFromObject(raw),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());camera.position.copy(center).add(new THREE.Vector3(0,size.y*.06,size.y*2.1));camera.lookAt(center);
 const a=new THREE.AnimationMixer(raw),b=new THREE.AnimationMixer(optimized),clips=gltf.animations.filter(c=>/^(Idle|Walk|Run|Wave)$/.test(c.name));let max=0,totalDifferences=0,beforeCalls=0,afterCalls=0;
 for(const clip of clips){a.stopAllAction();b.stopAllAction();a.clipAction(clip).play();b.clipAction(clip).play();for(const t of [.13,.61]){const before=pixels(raw,a,t),after=pixels(optimized,b,t);beforeCalls=before.calls;afterCalls=after.calls;for(let i=0;i<before.data.length;i++){const delta=Math.abs(before.data[i]-after.data[i]);max=Math.max(max,delta);if(delta)totalDifferences++;}}}
 results.push({name,stats,clips:clips.length,maxChannelDifference:max,totalDifferences,beforeCalls,afterCalls});if(totalDifferences>100)throw Error(name+' excessive changed channels '+totalDifferences);if(!clips.length)throw Error('No animation exercised');
 a.stopAllAction();b.stopAllAction();a.uncacheRoot(raw);b.uncacheRoot(optimized);disposeModelInstance(raw,{geometry:'shared',materials:'clone'});current=optimized;scene.add(current);renderer.render(scene,camera);
