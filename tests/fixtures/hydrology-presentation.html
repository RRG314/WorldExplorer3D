<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width" /><title>
    Hydrology instrument boundary</title
  ><link rel="icon" href="/favicon.svg" /><style>
    body {
      margin: 0;
    }
    canvas {
      display: block;
    }
    p {
      position: fixed;
      top: 10px;
      left: 12px;
      background: #183a33;
      color: #f5f7ef;
      padding: 8px;
      font: 14px system-ui;
    }
  </style>
  <p>
    Controlled virtual stream · actual geometry, float motion and optical paths · no source field
    claim
  </p>
  <script src="/app/vendor/three/build/three.min.js"></script>
  <script type="module">
    import { createHydrologyPresentation } from '/app/js/campaign/hydrology-presentation.js';
    import { HYDROLOGY_STUDIES } from '/app/js/campaign/hydrology-career.js';
    import { applyDisplayColorPolicy } from '/app/js/engine/display-color-policy.js';
    const T = THREE,
      scene = new T.Scene(),
      camera = new T.PerspectiveCamera(58, innerWidth / innerHeight, 0.04, 100),
      renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    applyDisplayColorPolicy(renderer, T);
    document.body.prepend(renderer.domElement);
    scene.background = new T.Color('#c9dbdb');
    scene.add(new T.HemisphereLight(0xffffff, 0x677257, 0.9));
    const sun = new T.DirectionalLight(0xffefdc, 1.3);
    sun.position.set(-7, 15, 5);
    scene.add(sun);
    const heightAt = (x, z) =>
        new URLSearchParams(location.search).has('flat') ? 0 : 0.025 * x + 0.012 * z,
      ground = new T.Mesh(
        new T.PlaneGeometry(100, 100),
        new T.MeshStandardMaterial({ color: 0x7c896b, roughness: 1 })
      );
    ground.material.color.convertSRGBToLinear();
    ground.geometry.rotateX(-Math.PI / 2);
    const vertices = ground.geometry.attributes.position;
    for (let i = 0; i < vertices.count; i++)
      vertices.setY(i, heightAt(vertices.getX(i), vertices.getZ(i)));
    ground.geometry.computeVertexNormals();
    scene.add(ground);
    const runtime = {
        scene,
        camera,
        renderer,
        METERS_PER_WORLD_UNIT: 1,
        dynamicBuildingColliders: [],
        SurfaceQuery: {
          driveAt: (x, z) => ({ kind: 'terrain', position: { x, y: heightAt(x, z), z } }),
        },
      },
      qualified = {
        metersPerUnit: 1,
        points: Object.fromEntries(
          Object.entries({ a: { x: -5, z: 0 }, b: { x: 5, z: 0 }, bench: { x: 0, z: 8 } }).map(
            ([id, p]) => [id, { ...p, y: heightAt(p.x, p.z) }]
          )
        ),
      };
    let presentation, active;
    async function setup(id = 'campaign') {
      presentation?.dispose();
      active = { runId: 'hydro-presentation-case', variantId: id, declaredCondition: null };
      presentation = await createHydrologyPresentation(runtime, qualified, HYDROLOGY_STUDIES[id], {
        isCurrent: () => true,
      });
      presentation.update(active);
      face();
      return presentation.budget;
    }
    function face() {
      camera.position.set(-9, 6, 12);
      camera.lookAt(0, 0.8, -1);
      camera.updateMatrixWorld(true);
    }
    function render() {
      renderer.render(scene, camera);
    }
    await setup();
    window.hydroVisual = {
      runtime,
      qualified,
      heightAt,
      get presentation() {
        return presentation;
      },
      setup,
      face,
      render,
      condition(after) {
        active.declaredCondition = after
          ? { id: HYDROLOGY_STUDIES[active.variantId].condition }
          : null;
        presentation.update(active);
      },
      start(id = 'a', kind = 'measure') {
        presentation.begin(kind, id);
      },
      step(seconds) {
        for (let t = 0; t < seconds; t += 0.05)
          presentation.stepInstrument(Math.min(0.05, seconds - t));
        render();
        return presentation.read();
      },
      view() {
        return presentation.read().clearView;
      },
      feet() {
        return presentation.footings.map((f) => ({
          actualY: new T.Box3().setFromObject(f.object).min.y,
          groundY: heightAt(f.x, f.z),
        }));
      },
      block() {
        const p = presentation.floats[1].getWorldPosition(new T.Vector3()),
          eye = camera.position.clone(),
          m = new T.Mesh(
            new T.BoxGeometry(1, 1, 1),
            new T.MeshStandardMaterial({ color: 0x222222 })
          );
        m.position.copy(eye.lerp(p, 0.5));
        scene.add(m);
        return m;
      },
      dispose() {
        presentation.dispose();
        return {
          attached: !!presentation.root.parent,
          colliders: runtime.dynamicBuildingColliders.length,
        };
      },
    };
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      render();
    });
    window.render_game_to_text = () =>
      JSON.stringify({ scope: 'Controlled actual geometry only', budget: presentation.budget });
    window.advanceTime = async (ms) => hydroVisual.step(ms / 1000);
    render();
    window.ready = true;
  </script>
</html>
