<!doctype html><meta charset="utf-8"><title>Regional building worker lifecycle</title><link rel="icon" href="data:,"><style>body{margin:0;background:#8eb9cf}canvas{display:block}pre{position:absolute;left:16px;top:8px;background:#ffffffdd;padding:12px;font:16px monospace}</style>
<pre id="status">Checking real worker decoding and scene publication…</pre>
<script src="/node_modules/three/build/three.min.js"></script>
<script type="module">
import {createRegionalBuildingWorker} from '/app/js/terrain/regional-building-runtime.js';
import {buildFarBuildingInstanceBatches} from '/app/js/terrain/far-building-instance-batches.js';
import {FarBuildingInstanceStorage} from '/app/js/terrain/far-building-instance-storage.js';
import {disposeFarFieldMesh} from '/app/js/terrain/far-field-geometry.js';
const varint=n=>{const a=[];do{let b=n&127;n>>>=7;if(n)b|=128;a.push(b);}while(n);return a;};
const scalar=(n,v)=>[...varint(n*8),...varint(v)];
const bytes=(n,v)=>[...varint(n*8+2),...varint(v.length),...v];
const string=(n,s)=>bytes(n,new TextEncoder().encode(s));
const features=[];
for(let i=0;i<1200;i++){
 const x=(i%40)*90+200,y=Math.floor(i/40)*90+200;
 const geometry=[9,x*2,y*2,26,80,0,0,80,79,0,15].flatMap(varint);
 features.push(...bytes(2,[...scalar(1,i+1),...bytes(2,[0,0]),...scalar(3,3),...bytes(4,geometry)]));
}
const source=new Uint8Array(bytes(3,[...string(1,'buildings'),...features,...string(3,'kind'),...bytes(4,string(1,'residential')),...scalar(5,4096),...scalar(15,2)]));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1000,700);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8eb9cf);scene.add(new THREE.HemisphereLight(0xffffff,0x666644,1));
const camera=new THREE.PerspectiveCamera(50,1000/700,.1,10000);camera.position.set(1500,1800,2200);camera.lookAt(0,0,0);
const gl=renderer.getContext(),live=new Set(),create=gl.createBuffer.bind(gl),remove=gl.deleteBuffer.bind(gl);
gl.createBuffer=()=>{const b=create();live.add(b);return b;};gl.deleteBuffer=b=>{live.delete(b);return remove(b);};
const cycles=[];let demo;
try{
 for(let cycle=0;cycle<4;cycle++){
  const runtime=await createRegionalBuildingWorker({bounds:{latS:-90,latN:90,lonW:-180,lonE:180},tileCount:1,unitsPerMeter:1});
  let descriptors,instances;
  try{
   await runtime.addTile({bytes:source,z:14,x:8192,y:8192});const result=await runtime.finish();descriptors=result.buildings;
   if(result.availableBuildings!==1200||descriptors.length!==1140||source.byteLength===0)throw Error('Coverage or source ownership changed');
   const scratch={massing:{color:[0,0,0]}};instances=new FarBuildingInstanceStorage(descriptors.length);
   for(let i=0;i<descriptors.length;i++){
    const b=descriptors.read(i,scratch),m=b.massing;
    instances.append(b.centerLon*111320-1200,-b.centerLat*110540-950,0,b.widthMeters,b.depthMeters,m.heightMeters,b.rotationY,m.color);
   }
   const group=new THREE.Group(),material=new THREE.MeshStandardMaterial();
   for(const mesh of await buildFarBuildingInstanceBatches(THREE,instances,material,{cellSize:256}))group.add(mesh);
   descriptors.dispose();instances.dispose();scene.add(group);renderer.render(scene,camera);
   if(cycle===3){demo=group;break;}
   scene.remove(group);disposeFarFieldMesh(group);renderer.render(scene,camera);
   cycles.push({cycle,buffers:live.size,geometries:renderer.info.memory.geometries,coverage:result.selectedBuildingTarget/result.availableBuildings});
   if(live.size||renderer.info.memory.geometries)throw Error('Worker publication retained GPU resources');
  }finally{runtime.dispose();descriptors?.dispose();instances?.dispose();}
 }
 window.advanceTime=()=>renderer.render(scene,camera);
 window.render_game_to_text=()=>JSON.stringify({ok:true,cycles,sourceBytes:source.byteLength,workerTerminatedBeforeRender:true,scope:'Real MVT worker decoding, transfer, geometry and retirement; controlled fixture'});
 window.fixtureReady=true;document.querySelector('#status').textContent='Real worker: 1,200 source footprints → 1,140 rendered (95%)\n3 decode → transfer → render → retirement cycles: 0 retained GPU buffers\nWorkers and construction buffers retire before each render';window.advanceTime();
}catch(e){window.fixtureError=e.stack;throw e;}
</script>
