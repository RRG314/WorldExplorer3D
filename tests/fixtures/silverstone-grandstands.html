<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;overflow:hidden}canvas{display:block}</style>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script><script type="module">
import {createSilverstoneGrandstandExteriors}from'/app/js/world/silverstone-grandstand-exterior.js';import{compileMappedVenueLayout}from'/app/js/racing/venue-layout.js';import{earthCoordinateFrame}from'/app/js/earth-core/coordinate-frame.js';import{attachCuratedTrafficVehicle,syncCuratedVehicleGroundPivot,disposeCuratedTrafficVehicle}from'/app/js/urban-sandbox/curated-traffic-vehicle.js';import{disposeLandmarkModel}from'/app/js/world/landmark-lifetime.js';
const T=THREE,source=await(await fetch('/app/assets/racing/silverstone/source.json')).json(),layout=compileMappedVenueLayout(source),frame=earthCoordinateFrame({lat:52.0713,lon:-1.0168},100000),ctx={METERS_PER_WORLD_UNIT:1,worldLoadRuntimeState:{venuePack:{id:'silverstone-grand-prix',sourceFeatureIds:layout.wayIds.map(id=>'osm:way:'+id)}},geoToWorld:(lat,lon)=>frame.toWorld(lat,lon),elevationWorldYAtWorldXZ:()=>10,buildingMeshes:[],roads:layout.wayIds.map(id=>({sourceFeatureId:'osm:way:'+id,pts:layout.ways.get(id).geometry.map(p=>frame.toWorld(p.lat,p.lon))}))},stands=createSilverstoneGrandstandExteriors(T,ctx),scene=new T.Scene();scene.background=new T.Color('#bfd2de');scene.add(new T.HemisphereLight(0xf3f8ff,0x646b55,.9));const sun=new T.DirectionalLight(0xffefdd,1.1);sun.position.set(-200,500,300);scene.add(sun);for(const s of stands)scene.add(s.root);const ground=new T.Mesh(new T.PlaneGeometry(4000,4000),new T.MeshStandardMaterial({color:0x758267,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=9.99;scene.add(ground);const car=new T.Group();await attachCuratedTrafficVehicle(T,car,{variantId:'bmw_m3_e92_race',preserveSourcePaint:true});syncCuratedVehicleGroundPivot(car);scene.add(car);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(55,12/7,.1,3000);let view=0;
function draw(){const stand=stands.find(s=>s.root.userData.buildingName===(view===2?'Copse A':'Hamilton Straight A')),center=stand.root.position;let best;for(const road of ctx.roads)for(let i=1;i<road.pts.length;i++){const a=road.pts[i-1],b=road.pts[i],dx=b.x-a.x,dz=b.z-a.z,t=Math.max(0,Math.min(1,((center.x-a.x)*dx+(center.z-a.z)*dz)/(dx*dx+dz*dz))),x=a.x+t*dx,z=a.z+t*dz,d=Math.hypot(x-center.x,z-center.z);if(!best||d<best.d)best={x,z,d,yaw:Math.atan2(dx,dz)};}const dx=(best.x-center.x)/best.d,dz=(best.z-center.z)/best.d;camera.position.set(center.x+dx*(view===1?140:best.d+12),view===1?70:14,center.z+dz*(view===1?140:best.d+12));camera.lookAt(center.x,18,center.z);car.position.set(best.x,11.12,best.z);car.rotation.y=best.yaw;renderer.render(scene,camera);}
addEventListener('keydown',e=>{if(e.code==='ArrowRight'){view=(view+1)%3;draw();}});window.advanceTime=draw;window.render_game_to_text=()=>JSON.stringify({scope:'22 exact mapped stands, controlled foundation, shared real M3 and bounded LODs; native publication checked separately',view,stands:stands.length,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,glError:renderer.getContext().getError()});addEventListener('pagehide',()=>{for(const s of stands)disposeLandmarkModel(s.root);disposeCuratedTrafficVehicle(car);ground.geometry.dispose();ground.material.dispose();renderer.dispose();});draw();
</script>
