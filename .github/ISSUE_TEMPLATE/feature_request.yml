name: Feature proposal
description: Propose a focused improvement to World Explorer 3D
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and Discussions for this proposal.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: dropdown
    attributes:
      label: Primary area
      options:
        - Earth runtime and map data
        - Vehicles and traversal
        - Ocean, Moon, Mars, or space
        - Multiplayer and social
        - Editors and creator tools
        - Accessibility and interface
        - Documentation and contributor experience
        - Build, testing, and operations
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: What observable behavior would make this complete?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add sketches, references, or screenshots if useful.
