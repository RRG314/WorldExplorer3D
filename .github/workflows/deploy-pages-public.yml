name: Deploy GitHub Pages (public)

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble public site
        run: |
          mkdir -p _site/assets/showcase
          cp -R github-pages/. _site/
          cp assets/landing/gameplay/showcase/*.webp _site/assets/showcase/
          cp assets/readme/*.webp _site/assets/showcase/

      - name: Upload project explainer
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
