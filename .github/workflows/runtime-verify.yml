name: Code and Package Checks

on:
  pull_request:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Bounded pull-request verification
        run: npm run verify:pr

      - name: Preserve component test inventory and sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-evidence
          path: output/verification/current-contracts/
          if-no-files-found: warn
          retention-days: 14

  stable-runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Install datum normalizer
        run: python -m pip install -r scripts/ground-datum-requirements.txt

      - name: Stable source and component checks
        run: npm run verify:pr

      - name: Verify immutable staging package
        run: node scripts/hosting-artifact.mjs build --firebase-env staging
