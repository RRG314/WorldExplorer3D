name: Android test package

on:
  workflow_dispatch:
    inputs:
      dependency_proposal:
        description: Resolve proposed new SDK locks/checksums for review (not release verification)
        type: boolean
        default: false
      launch_check:
        description: Verify native cold launch, offline recovery and retry
        type: boolean
        default: true
      widget_check:
        description: Verify the native Portal widget and Trail in an owned emulator
        type: boolean
        default: false
      widget_only:
        description: Check only debug widget interactions (does not verify a release package)
        type: boolean
        default: false
  push:
    branches: [steven/android-testing]
    paths: ['android/**', '.github/workflows/android-test.yml']

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-proposal:
    if: github.event_name == 'workflow_dispatch' && inputs.dependency_proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the targeted Android platform
        run: '"${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Resolve proposed dependency metadata and compile for review
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --write-verification-metadata sha256 --write-locks :app:lintRelease :app:assembleRelease :app:assembleDebug
      - name: Retain dependency proposal and compile diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-dependency-proposal
          path: |
            android/app/gradle.lockfile
            android/gradle/verification-metadata.xml
            android/app/build/reports/lint-results-release.*
          retention-days: 30
          if-no-files-found: error
  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.dependency_proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the targeted Android platform
        run: '"${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and lint unsigned packages
        if: github.event_name != 'workflow_dispatch' || !inputs.widget_only
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict :app:lintRelease :app:bundleRelease :app:assembleRelease
      - name: Prepare package evidence and local signing tool
        if: github.event_name != 'workflow_dispatch' || !inputs.widget_only
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-artifacts/
          cp android/app/gradle.lockfile android-artifacts/
          cp android/gradle/verification-metadata.xml android-artifacts/
          cp android/app/build/reports/lint-results-release.* android-artifacts/
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android-artifacts/app-release-unsigned.apk > android-artifacts/package-badging.txt
          git rev-parse HEAD > android-artifacts/source-commit.txt
          (cd android-artifacts && sha256sum * > SHA256SUMS)
      - name: Build the native widget verification host
        if: github.event_name == 'workflow_dispatch' && inputs.widget_check
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict :app:assembleDebug
      - name: Verify native Portal widgets
        if: github.event_name == 'workflow_dispatch' && inputs.widget_check
        timeout-minutes: 12
        run: bash scripts/verification/android-portal-widget.sh
      - name: Preserve native widget evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.widget_check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-widget-evidence
          path: android-widget-evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify Android launch and connection recovery
        if: github.event_name != 'workflow_dispatch' || (inputs.launch_check && !inputs.widget_only)
        timeout-minutes: 12
        run: bash scripts/verification/android-cold-launch.sh
      - name: Preserve Android launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-launch-evidence
          path: android-launch-evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain the exact unsigned package and evidence
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.widget_only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-explorer-android-${{ github.sha }}
          path: android-artifacts/
          retention-days: 30
          if-no-files-found: error
