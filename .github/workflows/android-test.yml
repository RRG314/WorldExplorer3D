name: Android test package

on:
  workflow_dispatch:
  push:
    branches: [steven/android-testing]
    paths: ['android/**', '.github/workflows/android-test.yml']

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the targeted Android platform
        run: '"${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and lint unsigned packages
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict :app:lintRelease :app:bundleRelease :app:assembleRelease
      - name: Prepare package evidence and local signing tool
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-artifacts/
          cp android/app/gradle.lockfile android-artifacts/
          cp android/gradle/verification-metadata.xml android-artifacts/
          cp android/app/build/reports/lint-results-release.* android-artifacts/
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android-artifacts/app-release-unsigned.apk > android-artifacts/package-badging.txt
          git rev-parse HEAD > android-artifacts/source-commit.txt
          (cd android-artifacts && sha256sum * > SHA256SUMS)
      - name: Retain the exact unsigned package and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-explorer-android-${{ github.sha }}
          path: android-artifacts/
          retention-days: 30
          if-no-files-found: error
