name: Secret Scan
on:
  push:
    branches: [steven/research-embodied-society]
  pull_request:
    branches: [steven/research-embodied-society]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    if: github.ref == 'refs/heads/steven/research-embodied-society' || github.base_ref == 'steven/research-embodied-society'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' 'gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete reachable research history
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml --log-opts=HEAD'
