name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup patched Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true

      - name: Install verified scanner
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/we3d-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/we3d-gitleaks" gitleaks
          printf '%s\n' "$RUNNER_TEMP/we3d-gitleaks" >> "$GITHUB_PATH"

      - name: Scan history and verify secret policy
        run: |
          gitleaks git --redact=100 --no-banner --timeout 600 --config .gitleaks.toml
          node scripts/verification/secret-scan-policy.mjs
