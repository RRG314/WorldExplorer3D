name: Build targeted security candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify private credential retention and Settings integration
        run: |
          node --test tests/provider-credentials-security-current.test.mjs
          node scripts/verification/provider-credentials-browser.mjs
      - name: Build both immutable environments sequentially
        run: |
          node scripts/hosting-artifact.mjs build --firebase-env production --output-dir output/hosting-validation/security-production
          node scripts/hosting-artifact.mjs build --firebase-env staging --output-dir output/hosting-validation/security-staging
      - name: Preserve exact candidates and focused evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-candidate-${{ github.sha }}
          path: |
            output/hosting-validation/security-production/
            output/hosting-validation/security-staging/
            output/verification/provider-credentials/
          retention-days: 3
