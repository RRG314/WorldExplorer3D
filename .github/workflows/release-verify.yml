name: Full Release Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Install Firebase release tooling
        run: npm install --global firebase-tools@15.22.0

      - name: Install datum normalizer
        run: python -m pip install -r scripts/ground-datum-requirements.txt

      - name: Install Playwright
        run: npx playwright install --with-deps chromium chrome

      - name: Full release verification
        run: npm run release:verify

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            output/release-evidence/
            output/verification/
            /tmp/worldexplorer3d-verification/
          if-no-files-found: warn
          retention-days: 14
