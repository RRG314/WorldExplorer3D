name: Backend Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
      WE3D_VERIFY_ROOT: dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@15.22.0
      - run: npx playwright install --with-deps chromium chrome
      - name: Build immutable staging artifact
        run: node scripts/hosting-artifact.mjs build --firebase-env staging
      - name: Verify all backend stages against isolated emulators
        run: node scripts/verification/system-release.mjs --run --scope=backend
      - name: Preserve results, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-${{ github.sha }}
          path: |
            output/release-evidence/
            output/verification/
            /tmp/worldexplorer3d-verification/
          retention-days: 7
          if-no-files-found: warn
