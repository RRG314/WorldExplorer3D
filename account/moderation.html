<!DOCTYPE html>
<html lang="en">

  <title>World Explorer Moderation Redirect</title>

  <style>
    body {
      margin: 0;

    <h1>Moderation moved</h1>
    <p>Moderation now lives inside the dedicated admin dashboard.</p>

  <script>
    window.location.replace('./admin.html?view=moderation');

</html>
