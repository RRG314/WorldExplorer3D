<!doctype html><html lang="en"><meta charset="utf-8"><link rel="icon" href="/favicon.svg"><title>Marine model review</title>
<style>body{margin:0;background:#101c29;color:white;font:14px system-ui}canvas{display:block}header{position:absolute;top:12px;left:12px}button{padding:8px;margin:4px}</style>
<header>Marine model review · author materials <button id="front" disabled>+Z</button><button id="back" disabled>−Z</button><button id="side" disabled>+X</button></header>
<script src="/app/vendor/three/build/three.min.js"></script><script src="/app/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
import {registerMaterialCompatibility} from '/app/js/assets/gltf-material-compatibility.js';
import {createSubmarineMesh} from '/app/js/ocean/submarine-visual.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x526d7c);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);
scene.add(new THREE.HemisphereLight(0xd5e9ff,0x576274,1));const sun=new THREE.DirectionalLight(0xffeddb,2);sun.position.set(10,18,10);scene.add(sun);
const path=new URLSearchParams(location.search).get('asset')||'/app/assets/models/marine/atlantic-explorer-submarine.glb';
let model;
if(new URLSearchParams(location.search).has('asset')) model=(await registerMaterialCompatibility(new THREE.GLTFLoader()).loadAsync(path)).scene;
else {model=createSubmarineMesh();if(!await model.userData.visualReady)throw new Error(model.userData.visualError);model.traverse(o=>{if(o.isLight)o.intensity=0;});}
scene.add(model);
const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x344d5a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=box.min.y-.03;scene.add(ground);
const radius=size.length()*.95;
function view(x,z){camera.position.copy(center).add(new THREE.Vector3(x*radius,radius*.28,z*radius));camera.lookAt(center);renderer.render(scene,camera);}
document.getElementById('front').onclick=()=>view(.5,1);document.getElementById('back').onclick=()=>view(-.5,-1);document.getElementById('side').onclick=()=>view(1,0);view(.5,1);
window.render_game_to_text=()=>JSON.stringify({asset:path,ready:!!model.userData.visualLoaded,bounds:{min:box.min.toArray(),max:box.max.toArray()},draws:renderer.info.render.calls,triangles:renderer.info.render.triangles});window.__fixtureReady=true;
document.querySelectorAll('button').forEach(button=>{button.disabled=false;});
addEventListener('pagehide',()=>model.userData.disposeCuratedMarineVisual?.(),{once:true});
</script></html>
