<!doctype html><html lang="en"><meta charset="utf-8"><title>Street ownership rendered regression</title><style>body{margin:20px;background:#18222b;color:white;font:16px system-ui}canvas{display:block}p{max-width:920px}</style><h1>Separate hillside carriageways</h1><p>Production terrain grading with two distinct road profiles and attached frontage. Dark surfaces must remain flat at their respective heights. The pale ground between streets joins their boundaries.</p><div id="view"></div><pre id="result">Loading</pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script type="module">
import {createTerrainHeightSamplingApi} from '../../app/js/terrain/height-sampling.js';
import {createStreetFrontageGrading} from '../../app/js/terrain/street-frontage-grading.js';
import {createCompiledRoadSurfaceSampler} from '../../app/js/terrain/rebuild.js';
const road=(z,y)=>({pts:[{x:0,z},{x:20,z}],width:4,type:'residential',tags:{sidewalk:'both'},surfaceBias:.18,structureSemantics:{terrainMode:'at_grade'},transportSurfaceModel:{distances:new Float32Array([0,20]),pathDistances:new Float32Array([0,20]),centerHeights:new Float32Array([y,y]),leftHeights:new Float32Array([y,y]),rightHeights:new Float32Array([y,y])}});
const roads=[road(0,2),road(6,6)],buildings=[0,10].map(x=>({pts:[{x,z:-12},{x:x+10,z:-12},{x:x+10,z:-10},{x,z:-10}]}));
const grading=createStreetFrontageGrading(buildings,1,roads),api=createTerrainHeightSamplingApi({appCtx:{structureTerrainCuts:roads,streetFrontageGrading:grading},elevationWorldYAtWorldXZ:()=>0});
const ground=(x,z)=>api.applyStructureTerrainCuts(x,z,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(940,440);renderer.setPixelRatio(1);document.querySelector('#view').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cabbc);scene.add(new THREE.HemisphereLight(0xffffff,0x606050,1.5));
function surface(x0,x1,z0,z1,sample,color){const geometry=new THREE.PlaneGeometry(x1-x0,z1-z0,80,40);geometry.rotateX(-Math.PI/2);const p=geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)+(x0+x1)/2,z=p.getZ(i)+(z0+z1)/2;p.setXYZ(i,x,sample(x,z),z);}geometry.computeVertexNormals();const mesh=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));scene.add(mesh);return mesh;}
surface(0,20,-8,12,ground,0xafa78d);
for(const r of roads)surface(0,20,r.pts[0].z-2,r.pts[0].z+2,createCompiledRoadSurfaceSampler(r,(x,z)=>ground(x,z)+.18),0x26313a);
const camera=new THREE.PerspectiveCamera(46,940/440,.1,500);camera.position.set(30,26,-29);camera.lookAt(10,2,2);renderer.render(scene,camera);
const low=ground(10,0)+.18,high=ground(10,6)+.18;document.querySelector('#result').textContent=JSON.stringify({lowerRoad:{expected:2,actual:low},upperRoad:{expected:6,actual:high},pass:Math.abs(low-2)<1e-6&&Math.abs(high-6)<1e-6,evidence:'Rendered bounded production-function regression. Not a full-city visual acceptance.'},null,2);
</script></html>
