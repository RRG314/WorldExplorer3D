<!doctype html><html lang="en"><meta charset="utf-8"><title>Street marking depth verification</title>
<style>body{background:#15202b;color:white;font:14px system-ui}pre{white-space:pre-wrap}</style>
<h1>Street marking depth verification</h1><p>Actual road and crossing materials, road-triangle projection, and low-to-high camera angles.</p><pre id="result">Running</pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script type="module">
import {createRoadSurfaceMaterials,createRoadMarkingMaterial} from '../../app/js/road-render.js?v=4';
import {createRoadContactIndex} from '../../app/js/terrain/road-contact-index.js?v=1';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(256,256);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,1));
const geometry=new THREE.PlaneGeometry(20,20,2,2);geometry.rotateX(-Math.PI/2);
const road=new THREE.Mesh(geometry,createRoadSurfaceMaterials().roadMainMaterial);road.userData.terrainMode='at_grade';road.renderOrder=2;scene.add(road);
const index=createRoadContactIndex([road]);const positions=[];
for(const points of [[{x:-3,z:-.6},{x:3,z:-.6},{x:-3,z:.6}],[{x:3,z:-.6},{x:3,z:.6},{x:-3,z:.6}]])positions.push(...index.projectTriangle(points));
const paintGeometry=new THREE.BufferGeometry();paintGeometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));paintGeometry.computeVertexNormals();
const paint=new THREE.Mesh(paintGeometry,createRoadMarkingMaterial({color:0xeee9df,emissive:0,emissiveIntensity:0}));paint.renderOrder=4;scene.add(paint);
const camera=new THREE.PerspectiveCamera(50,1,.05,10000),target=new THREE.WebGLRenderTarget(256,256),checks=[];
try{
 for(const height of [.2,.5,1,3,8,20]){
  camera.position.set(0,height,8);camera.lookAt(0,.012,0);camera.updateMatrixWorld();renderer.setRenderTarget(target);renderer.render(scene,camera);
  const projected=new THREE.Vector3(0,.012,0).project(camera),pixel=new Uint8Array(36);
  renderer.readRenderTargetPixels(target,Math.floor((projected.x+1)*128)-1,Math.floor((projected.y+1)*128)-1,3,3,pixel);
  // At the lowest angle the stripe is about one pixel high. Check the
  // 3x3 neighborhood of the projected point instead of assuming its center
  // lands on the center of a raster sample.
  let paintedPixels=0;for(let i=0;i<pixel.length;i+=4)if(pixel[i]>100&&pixel[i+1]>100&&pixel[i+2]>100)paintedPixels++;
  checks.push({cameraHeight:height,paintedPixels,pass:paintedPixels>0});
 }
 renderer.setRenderTarget(null);renderer.render(scene,camera);target.dispose();index.dispose();
 document.querySelector('#result').textContent=JSON.stringify({status:checks.every(c=>c.pass)?'pass':'fail',checks},null,2);
}catch(error){document.querySelector('#result').textContent=JSON.stringify({status:'fail',error:String(error),checks},null,2);}
</script></html>
